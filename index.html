<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Untitled Apparel — The Foundation Collection</title>
    <meta name="description" content="Timeless wardrobe essentials from Untitled Apparel. The Foundation Collection: 7 essential pieces built to last — heavyweight tees, oxford shirts, selvedge denim, and more." />
    <meta name="keywords" content="clothing, apparel, essentials, minimalist, wardrobe, organic cotton, selvedge denim" />
    <link rel="canonical" href="https://untitled-apparel-store.vercel.app/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Untitled Apparel — The Foundation Collection" />
    <meta property="og:description" content="Seven core pieces. Endless combinations. Quality that earns its place in your closet." />
    <meta property="og:image" content="/collection-hero.png" />
    <meta property="og:url" content="https://untitled-apparel-store.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Untitled Apparel — The Foundation Collection" />
    <meta name="twitter:description" content="Wardrobe essentials built to last. Clean silhouettes, quality fabrics, timeless design." />
    <meta name="twitter:image" content="/collection-hero.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600;700&family=Instrument+Serif:opsz@8..72&display=swap" rel="stylesheet" />

    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', {
        send_page_view: true,
        anonymize_ip: true,
      });
    </script>

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header class="site-header">
      <div class="container nav-container">
        <a href="/" class="logo" data-nav="home">
          <img src="/logo.svg" alt="Untitled Apparel" class="logo-img" />
        </a>
        <nav class="nav-links">
          <a href="/" data-nav="shop">Shop</a>
          <a href="/lookbook" data-nav="lookbook">Lookbook</a>
          <a href="/size-guide" data-nav="size-guide">Size Guide</a>
          <a href="/about" data-nav="about">About</a>
          <a href="/cart" class="cart-link" data-nav="cart">
            Cart (<span id="cart-count">0</span>)
          </a>
        </nav>
      </div>
    </header>

    <!-- Main Content Area (SPA) -->
    <main id="app" class="container"></main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>© 2025 Untitled Apparel. <em>Wear the blank page.</em></p>
        <nav class="footer-links">
          <a href="/privacy" data-nav="privacy">Privacy</a>
          <span class="footer-sep">·</span>
          <a href="/terms" data-nav="terms">Terms</a>
          <span class="footer-sep">·</span>
          <a href="/shipping" data-nav="shipping">Shipping & Returns</a>
        </nav>
      </div>
    </footer>

    <!-- Cart Modal -->
    <div id="cart-modal" class="cart-modal hidden">
      <div class="cart-modal-content">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <button id="cart-close" class="btn-close">&times;</button>
        </div>
        <div id="cart-items"></div>
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-price">$0.00</span>
        </div>
        <button id="checkout-btn" class="btn btn-primary btn-full">Checkout</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
